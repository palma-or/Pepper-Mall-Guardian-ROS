  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      Can u tell me how many people of [male](gender) gender have passed over the [gamma line](line) for [twenty-eight times](passages) and how many of them [don't](negation) wear a [visor]{"entity": "clothing", "value": "hat"}? 
    intent: count_people
  - action: action_count_people
  - action: utter_ask_stopping
  - user: |
      Stop.
    intent: stop
  - action: action_reset
  - action: utter_help
  - user: |
      How many people [don't](negation) carry a [briefcase]{"entity": "clothing", "value": "bag"}?
    intent: count_people
  - action: action_count_people
  - action: utter_ask_stopping 
  - user: | 
      and how many of them [don't](negation) wear a [hat](clothing)?
    intent: count_people
  - action: action_count_people
  - action: utter_ask_stopping
  - user: | 
      You can stop.
    intent: stop
  - action: action_reset
  - action: utter_help

