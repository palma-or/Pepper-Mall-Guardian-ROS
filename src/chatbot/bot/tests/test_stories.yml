stories:
- story: 1 - Greet Path
  steps:
  - user: |
      Hello There!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      What are you capable of?
    intent: capabilities
  - action: utter_capabilities
  - user: |
      Thank you
    intent: thanks
  - action: utter_thanks
  - user: |
      Bye!
    intent: goodbye
  - action: action_reset
  - action: utter_goodbye

- story: 2 - Generic Double Count Task
  steps:
  - user: |
      Hello, Pepper!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      How many people are currently in the mall?
    intent: count_people
  - action: action_count_people
  - action: utter_ask_stopping
  - user: |
      and how many of them are [boys]{"entity": "gender", "value": "male"}?
    intent: count_people
  - action: action_count_people
  - action: utter_ask_stopping
  - user: |
      Stop!
    intent: stop
  - action: action_reset
  - action: utter_help
  - user: |
      Goodbye!
    intent: goodbye
  - action: action_reset
  - action: utter_goodbye

- story: 3 - Form Path -- A test story with a form (Utter_Submit → intent = affirm)
  steps:
  - user: |
      Hi Pepper!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      I can no longer find my [daughter]{"entity": "gender", "value": "female"}. [She]{"entity": "gender", "value": "female"} is carrying a Winx [backpack]{"entity": "clothing", "value": "bag"} and wearing a wool [hat](clothing).
    intent: finding_someone
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      I can't remember at the moment, sorry.
    intent: doubt
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      yep
    intent: affirm
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      nope
    intent: deny
  - action: find_person_form
  - active_loop: null
  - action: utter_submit_find_person_form
  - user: |
      Yep
    intent: affirm
  - action: action_submit
  - user: |
      Thank u, Pepper!
    intent: thanks
  - action: utter_thanks
  - user: |
      Bye-bye, Pepper!
    intent: goodbye
  - action: action_reset  
  - action: utter_goodbye

- story: 4 - Form Path -- A test story with a form (Utter_Submit → intent = inform)
  steps:
  - user: |
      Hi Pepper!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      I can no longer find my friend. [He]{"entity": "gender", "value": "male"} is wearing a [hat](clothing), but [not](negation) a [rucksack]{"entity": "clothing", "value": "bag"}.
    intent: finding_someone
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: null
  - action: utter_submit_find_person_form
  - user: |
      Sorry. I made a mistake. [He]{"entity": "gender", "value": "male"} is [not](negation) wearing a [hat](clothing).
    intent: inform
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: null
  - action: utter_submit_find_person_form
  - user: |
      Yep!
    intent: affirm
  - action: action_submit
  - user: |
      Thanks for the information!
    intent: thanks
  - action: utter_thanks

- story: 5 - Form Path -- A test story with a form (Find_person_form → stop = reset)
  steps:
  - user: |
      Hello Peppa!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      I can no longer find my [grandma]{"entity": "gender", "value": "female"}. Are you able to find [her]{"entity": "gender", "value": "female"}?
    intent: finding_someone
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      [purse]{"entity": "clothing", "value": "bag"}
    intent: inform
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      I can't remember at the moment. Excuse me.
    intent: doubt
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      Don't worry. I found her. She just called me.
    intent: stop
  - action: action_reset
  - action: utter_help
  - action: action_deactivate_loop
  - active_loop: null

- story: 6 - Form Path -- A test story with a form (Utter_Submit → stop = reset)
  steps:
  - user: |
      I can no longer find my [son]{"entity": "gender", "value": "male"}. [He]{"entity": "gender", "value": "male"} wears a [knapsack]{"entity": "clothing", "value": "bag"} but [doesn't](negation) wear a [beret]{"entity": "clothing", "value": "hat"}.
    intent: finding_someone
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      Yeah
    intent: affirm
  - action: find_person_form
  - active_loop: null
  - action: utter_submit_find_person_form
  - user: |
      You can stop the form.
    intent: stop
  - action: action_reset
  - action: utter_help
  - user: |
      Bye.
    intent: goodbye
  - action: action_reset
  - action: utter_goodbye

- story: 7 - Form Path -- A test story with unexpected input during a form
  steps:
  - user: |
      Hi Pepper!
    intent: greet
  - action: action_reset
  - action: utter_greet
  - action: utter_help
  - user: |
      I can no longer find my cousin. [She]{"entity": "gender", "value": "female"} is wearing [neither](negation) a [hat](clothing) [nor](negation) a [purse]{"entity": "clothing", "value": "bag"}.
    intent: finding_someone
  - action: action_slot_mapping
  - action: find_person_form
  - active_loop: find_person_form
  - user: |
      How many people have crossed the [alpha line](line) for [sixty-one times](passages)?
    intent: count_people
  - action: action_reset
  - action: action_deactivate_loop
  - active_loop: null
  - action: action_count_people
  - action: utter_ask_stopping
  - user: |
      Stop!
    intent: stop
  - action: action_reset
  - action: utter_help
  - user: |
      Thanks for all!
    intent: thanks
  - action: utter_thanks

- story: 8 - Several Counting Request with Negation Recognition
